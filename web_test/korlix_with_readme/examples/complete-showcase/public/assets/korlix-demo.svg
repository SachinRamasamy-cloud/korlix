<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Korlix compiler illustration</title>
  <desc id="desc">A violet and cyan visual showing KLX source compiling to HTML CSS and JavaScript.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171525" />
      <stop offset="1" stop-color="#0f2e34" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7457f5" />
      <stop offset="1" stop-color="#17c9c3" />
    </linearGradient>
  </defs>
  <rect width="960" height="540" rx="32" fill="url(#background)" />
  <rect x="68" y="72" width="360" height="396" rx="22" fill="#151823" stroke="#403a68" />
  <circle cx="98" cy="104" r="7" fill="#e55262" />
  <circle cx="122" cy="104" r="7" fill="#f0a529" />
  <circle cx="146" cy="104" r="7" fill="#2bb673" />
  <g font-family="ui-monospace, monospace" font-size="22" fill="#d8d5ff">
    <text x="96" y="166">page Home at "/"</text>
    <text x="118" y="210">state count = 0</text>
    <text x="118" y="254">h1 "Korlix"</text>
    <text x="118" y="298">button "Build"</text>
    <text x="140" y="342">click=compile</text>
  </g>
  <path d="M468 270h92" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" />
  <path d="m540 238 36 32-36 32" fill="none" stroke="#17c9c3" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="610" y="112" width="282" height="316" rx="24" fill="#f8f9fc" />
  <rect x="642" y="152" width="218" height="42" rx="10" fill="#7457f5" />
  <rect x="642" y="222" width="150" height="24" rx="8" fill="#dcd7ff" />
  <rect x="642" y="264" width="192" height="18" rx="7" fill="#dfe2ea" />
  <rect x="642" y="298" width="176" height="18" rx="7" fill="#dfe2ea" />
  <rect x="642" y="350" width="112" height="42" rx="10" fill="#17c9c3" />
  <text x="676" y="380" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#0d0e13">Build</text>
</svg>
